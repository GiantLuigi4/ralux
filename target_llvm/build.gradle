plugins {
    id 'java'
}

group = 'tfc'
version = 'unspecified'

//ext.llvm_version = "21.1.8"
//ext.javacpp_version = "1.5.13"
ext.llvm_version = "19.1.3"
ext.javacpp_version = "1.5.11"

repositories {
    mavenCentral()
}

configurations {
    extraLibs
}

dependencies {
    // https://mvnrepository.com/artifact/org.antlr/antlr4-runtime
    extraLibs group: 'org.antlr', name: 'antlr4-runtime', version: '4.13.2'
    // https://mvnrepository.com/artifact/org.antlr/antlr4
    extraLibs group: 'org.antlr', name: 'antlr4', version: '4.13.2'

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

//    extraLibs 'org.bytedeco:llvm:13.0.1-1.5.7:windows-x86_64'
    extraLibs "org.bytedeco:llvm-platform:${llvm_version}-${javacpp_version}"
//    extraLibs "org.bytedeco:llvm:${llvm_version}-${javacpp_version}:windows-x86_64"
//    extraLibs 'org.bytedeco:llvm:windows-x86_64'
//    extraLibs "org.bytedeco:javacpp:${javacpp_version}:windows-x86_64"
//    extraLibs "org.bytedeco:javacpp:${javacpp_version}"

    extraLibs project(':rlxir')
    extraLibs project(":")

    configurations.implementation.extendsFrom(configurations.extraLibs)
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'testing.compiler.CompilerInvoker'
    }
    from {
        configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
